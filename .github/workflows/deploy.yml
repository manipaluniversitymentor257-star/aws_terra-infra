
name: Sudoku Application CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: sudoku-production-deployment
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: aws-terra-infra-sudoku
  TF_IN_AUTOMATION: true

jobs:
  build-and-deploy:
    name: Build, Push and Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::604175034103:role/aws-terra-infra-github-actions-role
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActionsDeployment

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          IMAGE="$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          echo "Building Docker image: $IMAGE"

          docker build -t "$IMAGE" ./app

          echo "Checking ECR registry connectivity..."

          curl --connect-timeout 10 \
            --max-time 20 \
            --silent \
            --show-error \
            --output /dev/null \
            --write-out "ECR HTTP status: %{http_code}\n" \
            "https://$REGISTRY/v2/"

          echo "Starting Docker push with debug logging..."

          timeout 10m docker --debug push "$IMAGE"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.6

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Plan
        run: |
          terraform plan \
            -input=false \
            -lock-timeout=5m \
            -var="image_tag=${GITHUB_SHA}" \
            -out=tfplan

      - name: Capture Previous Instance Refresh
        run: |
          ASG=$(terraform output -raw autoscaling_group_name)

          REFRESH_ID=$(aws autoscaling describe-instance-refreshes \
            --auto-scaling-group-name "$ASG" \
            --max-records 1 \
            --query "InstanceRefreshes[0].InstanceRefreshId" \
            --output text)

          echo "PREVIOUS_REFRESH_ID=$REFRESH_ID" >> "$GITHUB_ENV"
          echo "Previous refresh ID: $REFRESH_ID"

      - name: Terraform Apply
        run: terraform apply -input=false -auto-approve tfplan

      
      - name: Wait for Auto Scaling Instance Refresh
        run: |
          set -euo pipefail

          ASG=$(terraform output -raw autoscaling_group_name)

          for i in {1..90}; do
            RESULT=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name "$ASG" \
              --max-records 1 \
              --query "InstanceRefreshes[0].[InstanceRefreshId,Status]" \
              --output text)

            REFRESH_ID=$(echo "$RESULT" | awk '{print $1}')
            STATUS=$(echo "$RESULT" | awk '{print $2}')

            echo "Previous refresh: $PREVIOUS_REFRESH_ID"
            echo "Current refresh: $REFRESH_ID"
            echo "Status: $STATUS"

            if [[ "$REFRESH_ID" == "$PREVIOUS_REFRESH_ID" && "$STATUS" == "Successful" ]]; then
              echo "Previously completed refresh detected. Continuing deployment verification."
              exit 0
            fi

            if [[ "$REFRESH_ID" != "$PREVIOUS_REFRESH_ID" ]]; then
              case "$STATUS" in
                Successful)
                  echo "New instance refresh completed successfully."
                  exit 0
                  ;;
                Failed|Cancelled|RollbackSuccessful|RollbackFailed)
                  echo "Instance refresh failed or was rolled back."
                  exit 1
                  ;;
              esac
            fi

            sleep 20
          done

          echo "Timed out waiting for instance refresh."
          exit 1


      - name: Verify ALB Target Health
        run: |
          TG_ARN=$(terraform output -raw target_group_arn)

          for i in {1..40}; do
            HEALTHY=$(aws elbv2 describe-target-health \
              --target-group-arn "$TG_ARN" \
              --query "length(TargetHealthDescriptions[?TargetHealth.State=='healthy'])" \
              --output text)

            echo "Healthy ALB targets: $HEALTHY"

            if [ "$HEALTHY" -ge 2 ]; then
              echo "Deployment successful. Both application instances are healthy."
              exit 0
            fi

            sleep 15
          done

          echo "ALB target health verification failed."
          exit 1
